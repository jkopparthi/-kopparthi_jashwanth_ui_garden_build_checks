name: Code Quality Checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prettier check
        run: npm run format:check
      - name: ESLint check
        run: npm run lint
      - name: Run tests
        run: npm run test:ci
      - name: Production build
        run: npm run build
